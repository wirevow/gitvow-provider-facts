[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitvow-provider-facts"
version = "0.1.0"
description = "gitvow provider answering gate questions from a derived fact store of routes, gates and callers."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Nikhil Bora", email = "nikhil@wirevow.com"}]
keywords = ["gitvow", "provenance", "policy", "ai-agents", "git"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit[toml]>=1.7", "pip-audit>=2.7", "mypy>=1.10"]

[project.scripts]
gitvow-provider-facts = "gitvow_provider_facts.cli:main"

[project.urls]
Homepage = "https://wirevow.dev/gitvow-provider-facts"
Repository = "https://github.com/wirevow/gitvow-provider-facts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.pytest.ini_options]
addopts = "-q --cov=gitvow_provider_facts --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.bandit]
skips = ["B404", "B603", "B607"]

[tool.mypy]
python_version = "3.10"
strict = true
