site_name: gitvow-provider-facts
site_url: https://wirevow.dev/gitvow-provider-facts/
repo_url: https://github.com/wirevow/gitvow-provider-facts
theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features: [navigation.sections, navigation.expand, content.code.copy, search.suggest, navigation.footer]
extra_css: [stylesheets/wirevow.css]

markdown_extensions: [admonition, tables, toc, pymdownx.superfences, pymdownx.details]
copyright: © 2026 Wirevow · <a href='https://wirevow.com'>wirevow.com</a>
nav:
  - Home: index.md
  - Install and configure: install.md
  - The fact store: store.md
  - Security: security.md
